name: Unpack site.zip (one-time)
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site files with site.zip contents
        run: |
          if [ ! -f site.zip ]; then echo "no site.zip"; exit 0; fi
          mv site.zip /tmp/site.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          unzip -o -q /tmp/site.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update site files from site.zip"
          git push
