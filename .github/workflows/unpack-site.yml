name: Unpack site.zip (one-time)
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          if [ ! -f site.zip ]; then echo "no site.zip"; exit 0; fi
          unzip -o -q site.zip -d .
          git rm -q site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site files from site.zip"
          git push
